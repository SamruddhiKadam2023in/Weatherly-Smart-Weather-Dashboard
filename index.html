<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weatherly | Your Smart Weather Dashboard</title>

    <!-- Favicon -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>

    <!-- jQuery UI CSS (For Autocomplete) -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="dark-theme">

    <div class="app-container">
      <!-- Header -->
      <header class="main-header mb-4">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div>
            <h1 class="brand-title m-0">
              <i class="fas fa-cloud-sun text-accent mr-2"></i>Weatherly
            </h1>
            <p class="brand-tagline m-0">Your smart weather dashboard</p>
            <p id="today" class="date-subtitle m-0 mt-1"></p>
            <!-- Live Clock Display -->
            <p id="live-clock" class="clock-subtitle m-0"><i class="far fa-clock mr-1"></i><span>--:--:-- --</span></p>
          </div>

          <div class="d-flex align-items-center gap-3">
            <!-- Theme Toggle Switch -->
            <button id="theme-toggle" class="btn btn-theme-toggle mr-2" title="Toggle Light/Dark Mode">
              <i class="fas fa-moon"></i>
            </button>

            <!-- Temperature Unit Toggle Switch -->
            <div class="unit-toggle-wrapper">
              <span class="unit-label">°C</span>
              <label class="switch m-0">
                <input type="checkbox" id="unit-toggle">
                <span class="slider round"></span>
              </label>
              <span class="unit-label">°F</span>
            </div>
          </div>
        </div>
      </header>

      <div class="row">
        <!-- Sidebar: Search + Search History -->
        <aside class="col-lg-3 col-md-4 mb-4">
          <div class="glass-card p-3">
            <form id="search-form" class="form-group mb-3">
              <label for="search" class="search-label">Search Location</label>
              <div class="input-group">
                <input id="search" class="form-control custom-input" type="text" placeholder="e.g. London" aria-label="Search"/>
                <div class="input-group-append">
                  <button id="search-btn" class="btn btn-accent" type="submit">
                    <i class="fas fa-search"></i>
                  </button>
                </div>
              </div>
            </form>

            <button id="collapse-search-history" class="btn btn-sm btn-outline-light btn-block d-md-none mb-2" type="button" data-toggle="collapse" data-target="#search-history">
              Recent Searches
            </button>

            <div id="search-history-container" class="mt-3">
              <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                <span class="history-title">Recent Searches</span>
                <span id="delete-history" class="clear-history-btn" title="Clear History">
                  <i class="fas fa-trash-alt mr-1"></i> Clear
                </span>
              </div>
              <ul id="search-history" class="list-unstyled history-list"></ul>
            </div>
          </div>
        </aside>

        <!-- Main Content -->
        <main class="col-lg-9 col-md-8">
          <!-- Current Weather Data -->
          <section class="glass-card main-weather-card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div>
                <h2 id="city" class="city-name m-0"></h2>
                <span id="conditions" class="weather-condition-tag mt-1"></span>
              </div>
              <i id="icon" class="current-weather-icon"></i>
            </div>

            <div class="metrics-grid">
              <div class="metric-box">
                <span class="metric-label"><i class="fas fa-temperature-high mr-1"></i> Temp</span>
                <p id="temperature" class="metric-value m-0">--</p>
              </div>

              <div class="metric-box">
                <span class="metric-label"><i class="fas fa-tint mr-1"></i> Humidity</span>
                <p id="humidity" class="metric-value m-0">--</p>
              </div>

              <div class="metric-box">
                <span class="metric-label"><i class="fas fa-wind mr-1"></i> Wind Speed</span>
                <p id="wind-speed" class="metric-value m-0">--</p>
              </div>

              <div class="metric-box">
                <span class="metric-label"><i class="fas fa-sun mr-1"></i> UV Index</span>
                <div class="mt-1">
                  <span id="uv-index" class="uv-badge">--</span>
                </div>
              </div>

              <div class="metric-box">
                <span class="metric-label"><i class="fas fa-sun text-warning mr-1"></i> Sunrise</span>
                <p id="sunrise" class="metric-value m-0">--</p>
              </div>

              <div class="metric-box">
                <span class="metric-label"><i class="fas fa-moon text-info mr-1"></i> Sunset</span>
                <p id="sunset" class="metric-value m-0">--</p>
              </div>
            </div>
          </section>

          <!-- 5-Day Forecast -->
          <section>
            <h3 class="section-title mb-3">5-Day Forecast</h3>
            <div class="forecast-grid">
              <div class="forecast-card">
                <p id="day-1-date" class="forecast-date m-0"></p>
                <p id="day-1-year" class="forecast-year m-0 mb-2"></p>
                <i id="day-1-icon" class="forecast-icon my-2"></i>
                <p id="day-1-conditions" class="forecast-cond m-0 mt-1"></p>
                <div class="forecast-temp mt-2">
                  <span id="day-1-temp"></span>
                </div>
                <div id="day-1-humidity" class="forecast-sub"></div>
              </div>

              <div class="forecast-card">
                <p id="day-2-date" class="forecast-date m-0"></p>
                <p id="day-2-year" class="forecast-year m-0 mb-2"></p>
                <i id="day-2-icon" class="forecast-icon my-2"></i>
                <p id="day-2-conditions" class="forecast-cond m-0 mt-1"></p>
                <div class="forecast-temp mt-2">
                  <span id="day-2-temp"></span>
                </div>
                <div id="day-2-humidity" class="forecast-sub"></div>
              </div>

              <div class="forecast-card">
                <p id="day-3-date" class="forecast-date m-0"></p>
                <p id="day-3-year" class="forecast-year m-0 mb-2"></p>
                <i id="day-3-icon" class="forecast-icon my-2"></i>
                <p id="day-3-conditions" class="forecast-cond m-0 mt-1"></p>
                <div class="forecast-temp mt-2">
                  <span id="day-3-temp"></span>
                </div>
                <div id="day-3-humidity" class="forecast-sub"></div>
              </div>

              <div class="forecast-card">
                <p id="day-4-date" class="forecast-date m-0"></p>
                <p id="day-4-year" class="forecast-year m-0 mb-2"></p>
                <i id="day-4-icon" class="forecast-icon my-2"></i>
                <p id="day-4-conditions" class="forecast-cond m-0 mt-1"></p>
                <div class="forecast-temp mt-2">
                  <span id="day-4-temp"></span>
                </div>
                <div id="day-4-humidity" class="forecast-sub"></div>
              </div>

              <div class="forecast-card">
                <p id="day-5-date" class="forecast-date m-0"></p>
                <p id="day-5-year" class="forecast-year m-0 mb-2"></p>
                <i id="day-5-icon" class="forecast-icon my-2"></i>
                <p id="day-5-conditions" class="forecast-cond m-0 mt-1"></p>
                <div class="forecast-temp mt-2">
                  <span id="day-5-temp"></span>
                </div>
                <div id="day-5-humidity" class="forecast-sub"></div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Core Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.9.8/dayjs.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
